# iCloud calendar over CalDAV (caldav-mcp), stdio inside the member's gateway.
# Recipe format: connectors/README.md. Needs ICLOUD_EMAIL (Apple ID) and
# ICLOUD_APP_PASSWORD (app-specific password, appleid.apple.com → Sign-In and Security).
name   = "calendar-icloud"         # server "calendar-icloud-<member>"
domain = "calendar"

[server]
type    = "stdio"
command = "npx"
args    = ["-y", "caldav-mcp@0.10.0"]   # pinned: bump deliberately
[server.env]
CALDAV_USERNAME = "${ICLOUD_EMAIL}"
CALDAV_PASSWORD = "${ICLOUD_APP_PASSWORD}"
CALDAV_BASE_URL = "https://caldav.icloud.com/"
