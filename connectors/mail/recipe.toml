# Mailboxes through the gateway's native mail module (services/scotty-gateway,
# modules/mail): IMAP with an app password for iCloud and t-online, the Gmail
# API with OAuth (scope gmail.modify) for Gmail. The agent may read, mark, move
# (Trash and Spam included) and draft, and every change is logged
# (actions.jsonl); the module has no code that sends or permanently deletes.
# A member picks accounts in config/gateway/<member>.toml
# (`accounts = ["icloud", "gmail"]`); the chosen tables become the module's
# `config.accounts`. Recipe format: connectors/README.md.
name   = "email"                   # gateway server name "email-<member>"
domain = "email"

[server]
type   = "native"
module = "mail"

# Optional per account (module README): capabilities = ["read", "mark_read",
# "draft", "move"] (default all), drafts = "any" | "reply-only" (default any).

# Needs ICLOUD_EMAIL and ICLOUD_APP_PASSWORD (appleid.apple.com).
[accounts.icloud]
label    = "iCloud"
backend  = "imap"
email    = "${ICLOUD_EMAIL}"
username = "${ICLOUD_EMAIL}"
password = "${ICLOUD_APP_PASSWORD}"
host     = "imap.mail.me.com"
port     = 993

# Needs TONLINE_EMAIL and TONLINE_APP_PASSWORD (Passwort für E-Mail-Programme).
[accounts.tonline]
label    = "t-online"
backend  = "imap"
email    = "${TONLINE_EMAIL}"
username = "${TONLINE_EMAIL}"
password = "${TONLINE_APP_PASSWORD}"
host     = "secureimap.t-online.de"
port     = 993

# Gmail: no password. Needs GMAIL_EMAIL plus the household's OAuth client
# (GOOGLE_OAUTH_CLIENT_ID / _SECRET). Authorise once with
#   docker compose run --rm -p 127.0.0.1:8765:8765 mcp-gateway-<member> auth email-<member> gmail
# (services/scotty-gateway/README.md, "Authorising a Gmail account").
[accounts.gmail]
label    = "Gmail"
backend  = "gmail"
email    = "${GMAIL_EMAIL}"
