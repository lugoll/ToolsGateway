# Mailboxes over IMAP through a published email-mcp container per member (the
# sidecar in service.yml.tmpl), proxied by the gateway as an HTTP backend.
# Read/draft only: every sending/forwarding tool is disabled at the gateway
# and SMTP points at smtp.invalid. A member picks accounts in members.toml
# (`accounts = ["icloud", "gmail"]`). Recipe format: connectors/README.md.
name   = "email"                   # server key "email-<user>"
domain = "email"
doc    = "{{his}} {{connector.account_list}} {{#if connector.multi}}mailboxes{{else}}mailbox{{/if}}"

# Sidecar container; the gateway waits for its healthcheck.
[service]
template = "service.yml.tmpl"
name     = "mcp-email-{{user}}"
image    = "ghcr.io/codefuturist/email-mcp:0.2.3-alpine"

# Files rendered per member (paths relative to the repo root).
[[files]]
template = "files/config.toml.template.tmpl"
out      = "config/mcp-email-{{user}}/config.toml.template"

[gateway]
type            = "streamableHttp"
url             = "http://mcp-email-{{user}}:8080/mcp"
_note           = "protocolVersion legacy on purpose: in 'auto' mode 1MCP v0.38 probes the server with the MCP 2026 SDK, and that probe reports a refused connection (email container still starting) as a protocol error, which 1MCP treats as non-retryable -> the server stays lost until the gateway restarts. The legacy client has no probe, so the same failure is retried (see config.toml [asyncLoading])."
protocolVersion = "legacy"
# HTTP backend whose MCP session dies with the container: the watchdog probes it.
watchdog        = true
disabledTools   = [
  "send_email", "reply_email", "forward_email", "send_draft",
  "schedule_email", "extract_calendar", "add_to_calendar",
  "check_calendar_permissions", "list_calendars", "list_events",
  "list_reminders", "create_reminder",
  "analyze_email_for_scheduling", "delete_mailbox",
]

# Accounts a member can choose from. Every string is a template: {{USER}} is
# the member's upper-cased slug, so the env vars become ICLOUD_EMAIL_LUKAS etc.
[accounts.icloud]
label     = "iCloud"
env       = [{ stem = "ICLOUD_EMAIL", doc = "iCloud address" },
             { stem = "ICLOUD_APP_PASSWORD", doc = "app-specific password from appleid.apple.com" }]
email     = "${ICLOUD_EMAIL_{{USER}}}"
password  = "${ICLOUD_APP_PASSWORD_{{USER}}}"
imap_host = "imap.mail.me.com"
imap_port = 993

[accounts.gmail]
label     = "Gmail"
env       = [{ stem = "GMAIL_EMAIL", doc = "Gmail address" },
             { stem = "GMAIL_APP_PASSWORD", doc = "Google app password (myaccount.google.com → Security → App passwords)" }]
email     = "${GMAIL_EMAIL_{{USER}}}"
password  = "${GMAIL_APP_PASSWORD_{{USER}}}"
imap_host = "imap.gmail.com"
imap_port = 993

[accounts.tonline]
label     = "t-online"
env       = [{ stem = "TONLINE_EMAIL", doc = "t-online address" },
             { stem = "TONLINE_APP_PASSWORD", doc = "t-online mail password (Passwort für E-Mail-Programme)" }]
email     = "${TONLINE_EMAIL_{{USER}}}"
password  = "${TONLINE_APP_PASSWORD_{{USER}}}"
imap_host = "secureimap.t-online.de"
imap_port = 993

# mail_gate.py reads these; the /email_monitoring skill rewrites mail.accounts
# and mail.mark_read from the interview, so they are seeded only on create.
[gate_config.defaults.mail]
accounts  = "{{connector.account_names}}"    # a lone placeholder keeps the list type
mark_read = true
