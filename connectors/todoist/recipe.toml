# Todoist tasks through the official MCP server, launched by the member's
# gateway as a stdio process (npx). Recipe format: connectors/README.md.
# Needs TODOIST_API_KEY (Todoist Settings → Integrations → Developer → API token).
name   = "todoist"                 # gateway server name becomes "todoist-<member>"
domain = "todoist"                 # gateway endpoint /mcp/todoist and Hermes tool group

[server]
type    = "stdio"
command = "npx"
args    = ["-y", "@doist/todoist-mcp@13.4.0"]   # pinned: bump deliberately
[server.env]
TODOIST_API_KEY = "${TODOIST_API_KEY}"
