[project]
name = "tools-gateway"
version = "0.3.0"
description = "Multi-user MCP gateway: proxies remote MCP servers and hosts native connectors (mail, calendar), configured through a small web UI"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp==4.0.10",
    "uvicorn==0.54.0",
    "imapclient==4.1.0",
    "inscriptis==2.7.5",
    "google-auth==2.59.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "cryptography>=44",
    "argon2-cffi>=23.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "caldav>=1.4",
    "niquests>=3.21",
]

[project.scripts]
gateway = "gateway.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0", "httpx>=0.28", "radicale>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["imap: needs a GreenMail container (GATEWAY_TEST_IMAP=host:port)"]
