[project]
name = "scotty-gateway"
version = "0.1.0"
description = "Scotty2's per-member MCP gateway: proxies configured MCP servers and hosts native modules (mail)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastmcp==4.0.10",
    "uvicorn==0.54.0",
    "imapclient==4.1.0",
    "inscriptis==2.7.5",
    "google-auth==2.59.1",
    "google-auth-oauthlib==1.5.0",
    "requests>=2.32",
]

[project.scripts]
scotty-gateway = "scotty_gateway.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scotty_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["imap: needs a GreenMail container (SCOTTY_TEST_IMAP=host:port)"]
