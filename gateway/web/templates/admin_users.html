{% extends "base.html" %}
{% block title %}Users · Tools Gateway{% endblock %}
{% block content %}
<h1>Users</h1>
<section class="card">
  <table>
    <thead><tr><th>Name</th><th>Display name</th><th>Role</th><th>Status</th></tr></thead>
    <tbody>
    {% for u in users %}
      <tr class="{{ 'off' if u.disabled }}">
        <td><a href="/admin/users/{{ u.name }}">{{ u.name }}</a></td><td>{{ u.display_name }}</td>
        <td>{{ u.role }}</td><td>{{ "disabled" if u.disabled else "active" }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
<section class="card narrow">
  <h2>Create a user</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Name <input name="name" pattern="[a-z][a-z0-9\-]{1,31}" autocapitalize="none" required>
      <small class="muted">Lowercase; their tools live under /mcp/<em>name</em>.</small></label>
    <label>Display name <input name="display_name"></label>
    <label>Initial password <input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label class="check"><input type="checkbox" name="admin"> Admin</label>
    <button>Create</button>
  </form>
</section>
{% endblock %}
