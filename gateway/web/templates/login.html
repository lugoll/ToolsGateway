{% extends "base.html" %}
{% block title %}Log in · Tools Gateway{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Name <input name="name" value="{{ name or '' }}" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Log in</button>
  </form>
</section>
{% endblock %}
