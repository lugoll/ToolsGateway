{% extends "base.html" %}
{% block title %}Account · Tools Gateway{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ me.title }}</h1>
  <p class="muted">Signed in as <code>{{ me.name }}</code> ({{ me.role }}).</p>
  <h2>Change password</h2>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Again <input name="again" type="password" autocomplete="new-password" minlength="10" required></label>
    <button>Change password</button>
    <p class="muted">This logs you out everywhere.</p>
  </form>
</section>
{% endblock %}
