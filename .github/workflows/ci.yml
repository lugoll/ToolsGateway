# Tests the gateway on every push and PR. On main, a version in pyproject.toml
# that has no tag `vX.Y.Z` yet is released: the image is built, scanned with
# Trivy, pushed as ghcr.io/<owner>/tools-gateway:X.Y.Z (linux/amd64 for the
# laptop, linux/arm64 for the Pi), and the commit is tagged. A released version
# is never rebuilt. Actions are pinned by commit SHA (Dependabot keeps them current).
name: tools-gateway

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.14
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled"
        ports: ["3025:3025", "3143:3143"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - name: wait for GreenMail
        run: for i in $(seq 30); do (exec 3<>/dev/tcp/127.0.0.1/3143) 2>/dev/null && exit 0; sleep 2; done; exit 1
      - run: uv run pytest -q
        env:
          GATEWAY_TEST_IMAP: 127.0.0.1:3143
          GATEWAY_TEST_SMTP: 127.0.0.1:3025

  version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is released already: nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new: releasing"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: needs.version.outputs.new == 'true'
    needs: version
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write     # the release tag
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scan first: nothing is pushed while the image has a blocking finding.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tools-gateway:scan
          cache-to: type=gha,mode=max
      - run: scripts/scan.sh image tools-gateway:scan
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          tags: ghcr.io/${{ github.repository_owner }}/tools-gateway:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: tag the release
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
